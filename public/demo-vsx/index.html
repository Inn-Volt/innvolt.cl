        ${kpi('send', 'Esperando respuesta', mm(vigentes.reduce((a, c) => a + calcCot(c).total, 0)), `${vigentes.length} enviadas vigentes`, null)}
        ${kpi('badge-check', 'Tasa de aprobación', '46 %', 'Últimos 6 meses')}
        ${kpi('eye', 'Abrieron sin responder', vigentes.filter((c) => c.aperturas && !c.respuesta).length, 'Buen momento para llamar', true)}
        ${kpi('percent', 'Margen promedio aprobado', '27,4 %', `Mínimo exigido: ${MARGEN_MIN} %`, null)}
      </div>
      <div class="card" style="margin-top:16px">
        <h3>${ico('files')}Cotizaciones<span class="sub">clic en una para abrirla abajo</span></h3>
        <div class="chips" id="cotFiltros" style="margin-bottom:12px"></div>
        <div class="table-wrap"><table><thead><tr><th>N°</th><th>Asunto</th><th>Línea</th><th class="num">Total</th><th>Margen</th><th>Estado</th><th>Seguimiento</th></tr></thead><tbody id="cotLista"></tbody></table></div>
      </div>
      <div id="cotEditor" style="margin-top:16px"></div>`;
    pintarListaCot();
    editorCot();
    $('#cotFiltros').onclick = (e) => { const b = e.target.closest('[data-cf]'); if (!b) return; cotFiltro = b.dataset.cf; pintarListaCot(); };
    $('#cotLista').onclick = (e) => { const tr = e.target.closest('[data-cot]'); if (!tr) return; cotSel = tr.dataset.cot; pintarListaCot(); editorCot(); $('#cotEditor').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    $('#cotNueva').onclick = nuevaCot;
  };

  function pintarListaCot() {
    const C = D.cotizaciones;
    const filtros = [['todas', 'Todas', C.length], ['borrador', 'Borradores'], ['enviada', 'Enviadas'], ['aprobada', 'Aprobadas'], ['rechazada', 'Rechazadas'], ['vencida', 'Vencidas']]
      .map(([k, t]) => [k, t, k === 'todas' ? C.length : k === 'vencida' ? C.filter((c) => c.vencida).length : C.filter((c) => c.estado === k && !(k === 'enviada' && c.vencida)).length]);
    $('#cotFiltros').innerHTML = filtros.map(([k, t, n]) => `<button class="chip ${cotFiltro === k ? 'active' : ''}" data-cf="${k}">${t} · ${n}</button>`).join('');
    const lista = C.filter((c) => cotFiltro === 'todas' || (cotFiltro === 'vencida' ? c.vencida : c.estado === cotFiltro && !(cotFiltro === 'enviada' && c.vencida)));
    $('#cotLista').innerHTML = lista.map((c) => {
      const r = calcCot(c); const [seg, tono] = seguimientoCot(c); const [ln, li] = LINEAS_COT[c.linea];
      return `<tr class="click ${c.n === cotSel ? 'sel' : ''}" data-cot="${c.n}"><td class="mono">${c.n}</td><td><strong>${c.asunto}</strong><div class="muted small">${c.cliente}</div></td>
        <td><span class="cot-linea">${ico(li)}${ln}</span></td><td class="num"><strong>${c.lineas.length ? mm(r.total) : '—'}</strong></td>
        <td>${c.lineas.length ? pill(r.pct.toLocaleString('es-CL', { maximumFractionDigits: 1 }) + ' %', r.pct < MARGEN_MIN ? 'warn' : 'ok') : ''}</td>
        <td>${pill(...EST_COT[c.estado])}${c.vencida ? ' ' + pill('Vencida', 'bad') : ''}</td><td class="small seg-${tono}">${seg}</td></tr>`;
    }).join('') || `<tr><td colspan="7" class="muted">No hay cotizaciones con este filtro.</td></tr>`;
    lucide.createIcons();
  }

  function asistenteCot(c) {
    if (c.linea === 'obras') {
      return `<div class="cot-asist" data-asist="obras"><h4>${ico('ruler')}Agregar partida desde el análisis de precio unitario</h4>
        <div class="cot-fields">
          <label class="f-wide">Partida<select id="asApu">${D.apu.map((a, i) => `<option value="${i}">${a.d} (${a.u})</option>`).join('')}</select></label>
          <label>Cantidad<input id="asQ" type="number" min="0" step="any" value="500"></label>
          <label>Gastos generales %<input id="asGG" type="number" min="0" step="0.5" value="${c.gg || 12}"></label>
          <label>Utilidad %<input id="asUt" type="number" min="0" step="0.5" value="10"></label>
        </div>
        <div class="cot-calc" id="asCalc"></div></div>`;
    }
    if (c.linea === 'arriendo') {
      return `<div class="cot-asist" data-asist="arriendo"><h4>${ico('construction')}Agregar equipo desde la flota</h4>
        <div class="cot-fields">
          <label class="f-wide">Equipo<select id="asEq">${D.equipos.map((e, i) => `<option value="${i}">${e.id} · ${e.tipo} ${e.modelo}</option>`).join('')}</select></label>
          <label>Días<input id="asDias" type="number" min="1" step="1" value="10"></label>
          <label>Modalidad<select id="asMod"><option value="sin">Sin operador</option><option value="con">Con operador (+$95.000/día)</option></select></label>
          <label class="f-check"><input id="asFlete" type="checkbox" checked> Traslado ida y vuelta</label>
        </div>
        <div class="cot-calc" id="asCalc"></div></div>`;
    }
    return `<div class="cot-asist" data-asist="embalaje"><h4>${ico('box')}Calcular un embalaje NIMF 15 por medidas</h4>
      <div class="cot-fields">
        <label>Tipo<select id="asTipo"><option value="caja">Caja cerrada</option><option value="bin">Bin abierto</option><option value="pallet">Pallet / patín</option></select></label>
        <label>Largo (m)<input id="asL" type="number" min="0.2" step="0.05" value="2.4"></label>
        <label>Ancho (m)<input id="asA" type="number" min="0.2" step="0.05" value="1.2"></label>
        <label>Alto (m)<input id="asH" type="number" min="0.1" step="0.05" value="1.4"></label>
        <label>Cantidad<input id="asQ" type="number" min="1" step="1" value="10"></label>
      </div>
      <div class="cot-calc" id="asCalc"></div></div>`;
  }

  // Lo que propone el asistente según lo escrito: [línea(s) a agregar, explicación]
  function propuestaAsistente(c) {
    const v = (id) => Number($('#' + id)?.value) || 0;
    if (c.linea === 'obras') {
      const a = D.apu[v('asApu')]; const cd = a.mat + a.mo + a.eq; const k = 1 + (v('asGG') + v('asUt')) / 100;
      const p = Math.round(cd * k / 10) * 10;
      return [[{ d: a.d, u: a.u, q: v('asQ'), p, c: cd }],
        `Costo directo ${clp(cd)}/${a.u} = materiales ${clp(a.mat)} + mano de obra ${clp(a.mo)} + equipos ${clp(a.eq)}. Con gastos generales y utilidad: <strong>${clp(p)}/${a.u}</strong> · total ${clp(p * v('asQ'))}`];
    }
    if (c.linea === 'arriendo') {
      const e = D.equipos[v('asEq')]; const con = $('#asMod').value === 'con'; const dias = v('asDias');
      const p = e.tarifa + (con ? 95_000 : 0); const costo = Math.round(e.tarifa * 0.52) + (con ? 70_000 : 0);
      const lineas = [{ d: `${e.tipo} ${e.modelo} ${con ? 'con' : 'sin'} operador`, u: 'día', q: dias, p, c: costo }];
      if ($('#asFlete').checked) lineas.push({ d: 'Traslado en cama baja (ida y vuelta)', u: 'viaje', q: 2, p: 190_000, c: 190_000, cargo: true });
      const disp = { disponible: ['Disponible hoy', 'ok'], arrendado: [`Arrendado · ${e.ubic}`, 'warn'], 'en-obra': [`En obra propia · ${e.ubic}`, 'info'], mantencion: ['En mantención', 'bad'] }[e.estado];
      return [lineas, `${pill(...disp)} Tarifa ${clp(p)}/día × ${dias} días = <strong>${clp(p * dias)}</strong>${$('#asFlete').checked ? ' + traslado ' + clp(380_000) : ''}`];
    }
    const tipo = $('#asTipo').value; const L = v('asL'), A = v('asA'), H = v('asH'), q = v('asQ');
    const m3 = tipo === 'pallet' ? L * A * 0.075 : (tipo === 'caja' ? 2 * (L * A + L * H + A * H) * 0.025 : (L * A + 2 * (L + A) * H) * 0.028) + L * A * 0.02;
    const costo = Math.round(m3 * (330_000 + 45_000) * 1.22 / 100) * 100; const p = Math.round(costo * 1.38 / 1000) * 1000;
    const nombre = { caja: 'Caja de madera', bin: 'Bin de madera', pallet: 'Pallet de madera' }[tipo];
    return [[{ d: `${nombre} NIMF 15 · ${fmtN(L)} × ${fmtN(A)}${tipo === 'pallet' ? '' : ' × ' + fmtN(H)} m`, u: 'un', q, p, c: costo }],
      `Madera estimada: ${fmtN(Math.round(m3 * 1000) / 1000)} m³ por unidad (${fmtN(Math.round(m3 * 423.8))} pulgadas madereras), con tratamiento térmico y timbre IPPC. <strong>${clp(p)} por unidad</strong> · total ${clp(p * q)}`];
  }

  function filaCot(l, i, ed) {
    const bajo = !l.cargo && l.p < l.c;
    const mg = l.cargo || !l.p ? null : Math.round((l.p - l.c) / l.p * 100);
    const campo = (k, val) => ed ? `<input class="cot-in" type="number" min="0" step="any" data-i="${i}" data-k="${k}" value="${val}" aria-label="${k === 'q' ? 'Cantidad' : 'Precio unitario'} de ${l.d}">` : (k === 'q' ? fmtN(val) : clp(val));
    return `<tr class="${l.cargo ? 'cot-cargo' : ''}"><td><strong>${l.d}</strong>${l.cargo ? '<div class="muted small">Cargo operacional: se cobra tal cual, sin descuento ni margen</div>' : ''}${bajo && verCostos ? `<div style="margin-top:4px">${pill('Bajo el costo', 'bad')}</div>` : ''}</td>
      <td>${l.u}</td><td class="num">${campo('q', l.q)}</td><td class="num">${campo('p', l.p)}</td>
      ${verCostos ? `<td class="num muted">${clp(l.c)}</td><td class="num" data-mg="${i}">${mg === null ? '—' : pill(mg + ' %', mg < 0 ? 'bad' : mg < MARGEN_MIN ? 'warn' : 'ok')}</td>` : ''}
      <td class="num" data-tot="${i}"><strong>${clp(l.q * l.p)}</strong></td>${ed ? `<td><button class="icon-btn cot-del" data-del="${i}" aria-label="Quitar ${l.d}">${ico('trash-2')}</button></td>` : ''}</tr>`;
  }

  function resumenCot(c, r, ed) {
    const fila = (t, v, cls = '') => `<div class="cs-row ${cls}"><span>${t}</span><strong>${v}</strong></div>`;
    let h = fila('Subtotal', clp(r.venta));
    h += `<div class="cs-row"><span>Descuento ${ed ? `<input class="cot-in cot-desc" id="cotDesc" type="number" min="0" max="50" step="0.5" value="${c.desc || 0}" aria-label="Descuento en porcentaje"> %` : `${c.desc || 0} %`}</span><strong>−${clp(r.descuento)}</strong></div>`;
    if (r.cargos) h += fila('Cargos operacionales', clp(r.cargos));
    h += fila('Neto', clp(r.neto)) + fila('IVA 19 %', clp(r.iva)) + fila('Total', clp(r.total), 'cs-total');
    if (verCostos) {
      const tono = r.pct < 0 ? 'bad' : r.pct < MARGEN_MIN ? 'warn' : 'ok';
      h += `<div class="cs-interno"><div class="cs-lbl">${ico('lock')}Interno · no aparece en el PDF</div>
        ${fila('Costo directo', clp(r.costo))}${fila('Margen', `${clp(r.margen)} · ${r.pct.toLocaleString('es-CL', { maximumFractionDigits: 1 })} %`)}
        <div class="bar ${tono}" style="margin-top:6px"><span style="width:${Math.max(0, Math.min(100, r.pct * 2))}%"></span></div>
        ${r.pct < MARGEN_MIN && c.lineas.length ? `<div class="cs-aviso">${ico('triangle-alert')}Bajo el margen mínimo de ${MARGEN_MIN} %: necesita la aprobación de gerencia antes de enviar.</div>` : ''}</div>`;
    }
    return h;
  }

  function accionesCot(c) {
    const pdf = `<button class="btn" data-acc="pdf">${ico('file-text')}Vista previa del PDF</button>`;
    if (c.estado === 'borrador') return `${pdf}<button class="btn primary" data-acc="enviar" ${c.lineas.length ? '' : 'disabled'}>${ico('send')}Revisar y enviar</button>`;
    if (c.estado === 'enviada') return `${pdf}${c.respuesta ? `<div class="cs-resp"><strong>${c.respuesta.tipo}:</strong> «${c.respuesta.texto}»</div><button class="btn primary" data-acc="borrador">${ico('pencil')}Volver a borrador para ajustar</button>`
      : `<button class="btn" data-acc="reenviar">${ico('refresh-cw')}${c.vencida ? 'Renovar y reenviar' : 'Recordar al cliente'}</button>`}<button class="btn" data-acc="aprobar">${ico('badge-check')}Registrar aprobación</button>`;
    if (c.estado === 'aprobada') return `${pdf}${c.destino ? `<div class="cs-ok">${ico('circle-check')}Convertida en ${LINEAS_COT[c.linea][2]} <strong>${c.destino}</strong></div>` : `<button class="btn primary" data-acc="convertir">${ico('arrow-right-left')}Convertir en ${LINEAS_COT[c.linea][2]}</button>`}`;
    return `${pdf}<button class="btn" data-acc="duplicar">${ico('copy')}Duplicar como nueva</button>`;
  }

  function editorCot() {
    const c = D.cotizaciones.find((x) => x.n === cotSel);
    const ed = c.estado === 'borrador';
    const r = calcCot(c);
    const [ln, li] = LINEAS_COT[c.linea];
    $('#cotEditor').innerHTML = `<div class="cot-layout">
      <div class="card cot-main">
        <div class="cot-head"><div style="min-width:0"><div class="muted small">${c.n} · ${c.fecha} · válida ${c.validez} días</div><h2>${c.asunto}</h2><div class="muted small">${c.cliente} · ${c.contacto}</div></div>
          <div class="cot-tags">${pill(...EST_COT[c.estado])}${c.vencida ? pill('Vencida', 'bad') : ''}<span class="cot-linea">${ico(li)}${ln}</span></div></div>
        ${ed ? asistenteCot(c) : `<div class="empty-note">${ico('lock')}<div>${c.estado === 'enviada' ? 'Una cotización enviada no se edita: para cambiarla, vuelve a borrador y queda registrado en el historial.' : 'Esta cotización ya está cerrada. Puedes ver su PDF o duplicarla como una nueva.'}</div></div>`}
        <div class="cot-toolbar"><h4>Detalle</h4><label class="f-check"><input type="checkbox" id="verCostos" ${verCostos ? 'checked' : ''}> Ver costos y márgenes <span class="muted small">(solo gerencia)</span></label></div>
        <div class="table-wrap cot-tabla"><table><thead><tr><th>Descripción</th><th>Unidad</th><th class="num">Cantidad</th><th class="num">Precio unit.</th>${verCostos ? '<th class="num">Costo unit.</th><th class="num">Margen</th>' : ''}<th class="num">Total</th>${ed ? '<th></th>' : ''}</tr></thead>
          <tbody>${c.lineas.map((l, i) => filaCot(l, i, ed)).join('') || `<tr><td colspan="8" class="muted">Agrega la primera línea con el asistente de arriba.</td></tr>`}</tbody></table></div>
        <div class="cot-cond"><div><span>Condiciones de pago</span>${c.pago}</div><div><span>Validez</span>${c.validez} días desde el envío</div><div><span>Contacto</span>${c.contacto}</div></div>
      </div>
      <aside class="card cot-resumen">
        <h3>${ico('calculator')}Resumen</h3>
        <div id="cotSum">${resumenCot(c, r, ed)}</div>
        <div class="cot-acc">${accionesCot(c)}</div>
        <h4>Historial</h4><ol class="cot-hist">${c.hist.map(([f, t]) => `<li><span>${f}</span>${t}</li>`).join('')}</ol>
      </aside></div>`;
    lucide.createIcons();
    const ed$ = $('#cotEditor');
    const actualizar = () => { $('#cotSum').innerHTML = resumenCot(c, calcCot(c), ed); lucide.createIcons(); pintarListaCot(); };
    ed$.oninput = (e) => {
      const t = e.target;
      if (t.dataset.k) {
        const l = c.lineas[+t.dataset.i]; l[t.dataset.k] = Number(t.value) || 0;
        ed$.querySelector(`[data-tot="${t.dataset.i}"]`).innerHTML = `<strong>${clp(l.q * l.p)}</strong>`;
        const mgc = ed$.querySelector(`[data-mg="${t.dataset.i}"]`);
        if (mgc && !l.cargo && l.p) { const mg = Math.round((l.p - l.c) / l.p * 100); mgc.innerHTML = pill(mg + ' %', mg < 0 ? 'bad' : mg < MARGEN_MIN ? 'warn' : 'ok'); }
        actualizar();
      } else if (t.id === 'cotDesc') { c.desc = Math.min(50, Number(t.value) || 0); actualizar(); }
      else if (t.closest('.cot-asist')) calcAsistente();
    };
    ed$.onchange = (e) => {
      if (e.target.id === 'verCostos') { verCostos = e.target.checked; editorCot(); }
      else if (e.target.dataset.k) editorCot();
      else if (e.target.closest('.cot-asist')) calcAsistente();
    };
    ed$.onclick = (e) => {
      const del = e.target.closest('[data-del]');
      if (del) { c.lineas.splice(+del.dataset.del, 1); editorCot(); pintarListaCot(); return; }
      if (e.target.closest('#asAgregar')) {
        const [nuevas] = propuestaAsistente(c); c.lineas.push(...nuevas);
        editorCot(); pintarListaCot(); vsxToastSeguro(`${nuevas.length === 1 ? 'Línea agregada' : nuevas.length + ' líneas agregadas'} al detalle`); return;
      }
      const b = e.target.closest('[data-acc]'); if (!b) return;
      accionCot(c, b.dataset.acc);
    };
    function calcAsistente() {
      if (!$('#asCalc')) return;
      const [, txt] = propuestaAsistente(c);
      $('#asCalc').innerHTML = `<div>${txt}</div><button class="btn primary sm" id="asAgregar">${ico('plus')}Agregar al detalle</button>`;
      lucide.createIcons();
    }
    calcAsistente();
  }
  const vsxToastSeguro = (t) => window.vsxToast ? window.vsxToast(t) : null;

  function accionCot(c, acc) {
    const hora = '02/11 ' + new Date().toTimeString().slice(0, 5);
    const rehacer = (msg) => { cerrarModal(); pintarListaCot(); editorCot(); if (msg) vsxToastSeguro(msg); };
    if (acc === 'pdf') return pdfCot(c);
    if (acc === 'enviar') return enviarCot(c);
    if (acc === 'borrador') { c.estado = 'borrador'; c.hist.push([hora, `Vuelve a borrador para ajustar: ${c.respuesta ? 'el cliente pidió cambios' : 'ajuste interno'}`]); c.respuesta = null; return rehacer('Volvió a borrador: ya puedes editarla'); }
    if (acc === 'reenviar') { c.vencida = false; c.hist.push([hora, 'Recordatorio enviado al cliente con el mismo enlace']); return rehacer('Recordatorio enviado'); }
    if (acc === 'aprobar') { c.estado = 'aprobada'; c.decidio = '02-11'; c.hist.push([hora, 'Aprobación registrada por Gerencia VSX (el cliente confirmó por teléfono)']); return rehacer('Aprobación registrada'); }
    if (acc === 'convertir') { c.destino = LINEAS_COT[c.linea][3]; c.hist.push([hora, `Convertida en ${LINEAS_COT[c.linea][2]} ${c.destino}, con su detalle y montos`]); return rehacer(`Se creó ${LINEAS_COT[c.linea][2]} ${c.destino}`); }
    if (acc === 'duplicar') {
      const n = 'COT-' + (1148 + D.cotizaciones.filter((x) => x.n > 'COT-1148').length + 1);
      D.cotizaciones.unshift({ ...JSON.parse(JSON.stringify(c)), n, estado: 'borrador', fecha: '02/11/2026', aperturas: 0, respuesta: null, vencida: false, destino: null, decidio: null, motivo: null, hist: [[hora, `Creada como copia de ${c.n}`]] });
      cotSel = n; cotFiltro = 'todas'; return rehacer(`Se creó ${n} como borrador`);
    }
  }

  function nuevaCot() {
    abrirModal('Nueva cotización', `<p class="muted" style="margin-top:0">¿De qué línea de negocio es? El asistente cambia según la línea.</p>
      <div class="cot-nueva">${Object.entries(LINEAS_COT).map(([k, [t, i]]) => `<button class="card" data-nl="${k}">${ico(i)}<strong>${t}</strong><span class="muted small">${{ obras: 'Partidas con análisis de precio unitario', arriendo: 'Equipos de la flota, días y traslado', embalaje: 'Cajas, bins y pallets por medidas' }[k]}</span></button>`).join('')}</div>`);
    $('#modalCard').onclick = (e) => {
      const b = e.target.closest('[data-nl]'); if (!b) return;
      const n = 'COT-' + (1148 + D.cotizaciones.filter((x) => x.n > 'COT-1148').length + 1);
      D.cotizaciones.unshift({ n, linea: b.dataset.nl, cliente: 'Cliente nuevo (demo)', asunto: `Nueva cotización · ${LINEAS_COT[b.dataset.nl][0]}`, estado: 'borrador', fecha: '02/11/2026', validez: 15, contacto: 'Por completar',
        pago: '30 días desde la factura', desc: 0, gg: 12, lineas: [], hist: [['02/11 ' + new Date().toTimeString().slice(0, 5), 'Creada por Gerencia VSX']] });
      cotSel = n; cotFiltro = 'todas'; cerrarModal(); pintarListaCot(); editorCot();
      $('#cotEditor').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
  }

  function docCot(c) {
    const r = calcCot(c);
    return `<div class="report">
      <div class="report-head"><img src="${window.VSX_LOGO}" alt="VSX"><div class="rh-right"><strong>Cotización ${c.n}</strong>${c.fecha} · válida por ${c.validez} días<br>Ingeniería VSX Obras Civiles</div></div>
      <h4>Cliente</h4><div class="kv"><div><span>Empresa</span>${c.cliente}</div><div><span>Contacto</span>${c.contacto}</div><div><span>Asunto</span>${c.asunto}</div></div>
      <h4>Detalle</h4>
      <table class="rep-table"><thead><tr><th>Descripción</th><th>Unidad</th><th class="num">Cantidad</th><th class="num">Precio unit.</th><th class="num">Total</th></tr></thead><tbody>
      ${c.lineas.map((l) => `<tr><td>${l.d}</td><td>${l.u}</td><td class="num">${fmtN(l.q)}</td><td class="num">${clp(l.p)}</td><td class="num">${clp(l.q * l.p)}</td></tr>`).join('')}</tbody></table>
      <div class="rep-tot"><div><span>Subtotal</span>${clp(r.venta + r.cargos)}</div>${r.descuento ? `<div><span>Descuento ${c.desc} %</span>−${clp(r.descuento)}</div>` : ''}<div><span>Neto</span>${clp(r.neto)}</div><div><span>IVA 19 %</span>${clp(r.iva)}</div><div class="t"><span>Total</span>${clp(r.total)}</div></div>
      <h4>Condiciones</h4><p style="font-size:13px;margin:0">Forma de pago: ${c.pago}. Validez: ${c.validez} días. Precios en pesos chilenos. Para aprobar, use el botón «Aprobar» del enlace que recibió o responda este documento.</p>
      <div class="sign"><div><div class="firma">Gerencia VSX</div>Ingeniería VSX Obras Civiles</div><div><div class="firma">&nbsp;</div>Aprobación del cliente</div></div>
    </div>`;
  }
  function pdfCot(c) {
    abrirModal(`Vista previa · ${c.n}`, `<p class="muted small" style="margin-top:0">${ico('eye-off')} Así la ve el cliente: sin costos ni márgenes.</p>${docCot(c)}`, `<button class="btn sm primary" id="cotPdf">${ico('download')}Descargar PDF</button>`);
    $('#cotPdf').onclick = () => vsxToastSeguro('En el sistema, este botón descarga la cotización en PDF.');
  }
  function enviarCot(c) {
    const r = calcCot(c);
    const correo = (c.contacto.match(/[\w.]+@[\w.]+/) || ['cliente@empresa.cl'])[0];
    abrirModal(`Revisar y enviar · ${c.n}`, `
      ${r.pct < MARGEN_MIN ? `<div class="empty-note" style="margin-bottom:14px">${ico('triangle-alert')}<div>El margen es ${r.pct.toLocaleString('es-CL', { maximumFractionDigits: 1 })} %, bajo el mínimo de ${MARGEN_MIN} %. Al enviarla quedará registrado que gerencia lo aprobó.</div></div>` : ''}
      <div class="cot-envio">
        <div class="cot-fields">
          <label>Canal<select id="envCanal"><option>Correo</option><option>WhatsApp</option><option>La mando yo (copiar enlace)</option></select></label>
          <label class="f-wide">Para<input id="envPara" value="${correo}"></label>
          <label class="f-full">Mensaje<textarea id="envMsg" rows="4">Estimados ${c.cliente}:\nAdjuntamos la cotización ${c.n}, «${c.asunto}», por un total de ${clp(r.total)} IVA incluido. En el enlace pueden revisarla, descargar el PDF, hacer consultas o aprobarla.\nSaludos, Ingeniería VSX.</textarea></label>
        </div>
        <div class="cot-enlace">${ico('link')}<div><strong>Enlace del cliente</strong><span class="muted small">El cliente la ve sin costos, la descarga en PDF y responde: aprobar, pedir cambios o consultar. Cada apertura queda en el historial.</span></div></div>
      </div>`, `<button class="btn sm primary" id="envOk">${ico('send')}Enviar</button>`);
    $('#envOk').onclick = () => {
      const canal = $('#envCanal').value.split(' ')[0];
      c.estado = 'enviada'; c.aperturas = 0;
      c.hist.push(['02/11 ' + new Date().toTimeString().slice(0, 5), `Enviada por ${canal.toLowerCase()} a ${$('#envPara').value} · total ${clp(r.total)}`]);
      cerrarModal(); pintarListaCot(); editorCot(); vsxToastSeguro(`Cotización ${c.n} enviada por ${canal.toLowerCase()}`);
    };
  }

  // ---------- Personal ----------
  VISTAS.personal = () => {
    view.innerHTML = `
      <div class="page-head"><div><h1>Personal</h1><p>Asistencia geolocalizada, horas por obra y documentos con vencimiento</p></div>
        <div class="actions"><button class="btn">${ico('file-spreadsheet')}Exportar para remuneraciones</button><button class="btn primary">${ico('user-plus')}Nuevo trabajador</button></div></div>
      <div class="grid kpis">
        ${kpi('user-check', 'Presentes hoy', D.personal.filter((p) => p.est !== 'bad').length + ' / ' + D.personal.length, '1 atraso · 1 ausente', true)}
        ${kpi('clock', 'Horas cargadas a obras (oct.)', '6.840 h', 'Costo MO ' + mm(74_000_000), null)}
        ${kpi('file-badge', 'Documentos por vencer', 4, 'Licencias y exámenes', true)}
        ${kpi('hand-coins', 'Rendiciones pendientes', 3, clp(412_800), null)}
      </div>
      <div class="card" style="margin-top:16px"><h3>${ico('map-pin-check')}Asistencia de hoy<span class="sub">marcada desde el celular con ubicación</span></h3><div class="table-wrap"><table>
        <thead><tr><th>Trabajador</th><th>Cargo</th><th>Lugar de marcación</th><th>Entrada</th><th>Estado</th></tr></thead><tbody>
        ${D.personal.map((p) => `<tr><td><strong>${p.nombre}</strong></td><td>${p.cargo}</td><td>${p.lugar}</td><td class="mono">${p.entrada}</td><td>${pill(p.est === 'ok' ? 'En faena' : p.est === 'warn' ? 'Atraso 12 min' : 'Sin marcar', p.est)}</td></tr>`).join('')}
        </tbody></table></div></div>`;
  };

  // ---------- Finanzas ----------
  VISTAS.finanzas = () => {
    const lineas = [['Obras civiles', 1_366, 1_121, 'naranja'], ['Arriendo de maquinaria', 237, 151, '#5B5E66'], ['Embalaje industrial', 133, 96, 'acero']];
    view.innerHTML = `
      <div class="page-head"><div><h1>Finanzas</h1><p>Facturación electrónica directa al SII · rentabilidad por línea y por obra · reportes para el contador</p></div>
        <div class="actions"><span class="pill ok" style="align-self:center">Conectado al SII · folios disponibles: 412</span><button class="btn">${ico('file-down')}Reportes para el contador</button><button class="btn primary">${ico('receipt')}Emitir factura</button></div></div>
      <div class="grid kpis">
        ${kpi('wallet', 'Ingresos 2026', '$1.736 MM', 'Ene–oct', null)}
        ${kpi('trending-up', 'Margen bruto', '21,7 %', '+1,2 puntos vs. 2025')}
        ${kpi('receipt', 'Cuentas por cobrar', '$302 MM', '$48 MM vencidas más de 60 días', true)}
        ${kpi('credit-card', 'Cuentas por pagar', '$141 MM', 'Próximos 30 días', null)}
      </div>
      <div class="card" style="margin-top:16px"><h3>${ico('chart-pie')}Rentabilidad por línea de negocio<span class="sub">millones de pesos · 2026</span></h3><div class="table-wrap"><table>
        <thead><tr><th>Línea</th><th class="num">Ingresos</th><th class="num">Costos directos</th><th class="num">Margen</th><th>Margen %</th></tr></thead><tbody>
        ${lineas.map(([l, i, c]) => `<tr><td><strong>${l}</strong></td><td class="num">${i.toLocaleString('es-CL')}</td><td class="num">${c.toLocaleString('es-CL')}</td><td class="num">${(i - c).toLocaleString('es-CL')}</td><td style="width:200px">${bar(Math.round((i - c) / i * 100), 'ok')}</td></tr>`).join('')}
        </tbody></table></div></div>
      <div class="card" style="margin-top:16px"><h3>${ico('hard-hat')}Rentabilidad por obra</h3><div class="table-wrap"><table>
        <thead><tr><th>Obra</th><th class="num">Cobrado</th><th class="num">Costo real</th><th>Margen</th></tr></thead><tbody>
        ${D.obras.map((o, i) => { const cob = o.monto * o.financiero / 100; const mg = [18, 6, 24, 15, 21, -3][i]; return `<tr><td><strong>${o.nombre}</strong><div class="muted small">${o.id}</div></td><td class="num">${mm(cob)}</td><td class="num">${mm(cob * (1 - mg / 100))}</td><td>${pill(mg + ' %', mg < 0 ? 'bad' : mg < 10 ? 'warn' : 'ok')}</td></tr>`; }).join('')}
        </tbody></table></div></div>`;
  };

  // ---------- Tienda ----------
  VISTAS.tienda = () => {
    view.innerHTML = `
      <div class="page-head"><div><h1>Tienda</h1><p>Catálogo público en vsx.cl: arriendos, embalajes y servicios, con pago en línea</p></div>
        <div class="actions"><button class="btn">${ico('external-link')}Ver como cliente</button><button class="btn primary">${ico('plus')}Nuevo producto</button></div></div>
      <div class="empty-note" style="margin-bottom:16px">${ico('info')}<div>Por definir con VSX qué se venderá. Este ejemplo publica arriendos con calendario de disponibilidad y productos de embalaje, con pago por Webpay o Mercado Pago. Los pedidos entran directo a Arriendos o Embalaje.</div></div>
      <div class="equip-grid">${D.tienda.map((t) => `<div class="card equip"><div class="eimg">${ico(t.icono)}</div><div><span class="pill neutral">${t.cat}</span><div style="margin-top:8px"><strong>${t.nombre}</strong></div></div>
        <div class="erow"><strong style="font-size:16px">${t.precio ? clp(t.precio) : 'Sin costo'}</strong><button class="btn sm primary">${t.precio ? 'Agregar' : 'Solicitar'}</button></div></div>`).join('')}</div>`;
  };

  // Modo captura (para la propuesta): sin aviso superior y, si se pide, con un informe abierto
  const qs = new URLSearchParams(location.search);
  if (qs.has('captura')) document.body.classList.add('captura');
  window.vsxInforme = (id) => informeVisita(D.refugios.find((r) => r.id === id) || D.refugios.find((r) => r.estado === 'falla'));
  window.vsxCerrarModal = cerrarModal;
  render();
  if (qs.get('informe')) informeVisita(D.refugios.find((r) => r.id === qs.get('informe')) || D.refugios[0]);
})();

</script>

</body></html>
