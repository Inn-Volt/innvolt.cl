:root {
  --naranja: #FE5C01;
  --naranja-2: #FF7A2E;
  --naranja-suave: #FFF0E6;
  --acero: #C8CACD;
  --acero-osc: #8E9196;
  --negro: #111113;
  --side: #17181B;
  --side-2: #222327;
  --bg: #F4F5F7;
  --card: #FFFFFF;
  --text: #1C1D21;
  --muted: #6B6F76;
  --line: #E4E6EA;
  --ok: #1F9D55;
  --ok-bg: #E6F6EC;
  --warn: #C27803;
  --warn-bg: #FDF3DC;
  --bad: #D93025;
  --bad-bg: #FCE8E6;
  --info: #2563EB;
  --info-bg: #E8EFFD;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(16,17,19,.05), 0 2px 8px rgba(16,17,19,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0F11; --card: #18191C; --text: #ECEDEF; --muted: #9A9EA6; --line: #2A2C31;
    --naranja-suave: #3A2212; --ok-bg: #12301F; --warn-bg: #352A10; --bad-bg: #3A1614; --info-bg: #152443;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0F11; --card: #18191C; --text: #ECEDEF; --muted: #9A9EA6; --line: #2A2C31;
  --naranja-suave: #3A2212; --ok-bg: #12301F; --warn-bg: #352A10; --bad-bg: #3A1614; --info-bg: #152443;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
button { font: inherit; cursor: pointer; }
svg.lucide { width: 18px; height: 18px; stroke-width: 2; flex: none; }

.demo-banner { position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: 26px; line-height: 26px; text-align: center;
  font-size: 12px; font-weight: 600; letter-spacing: .02em; background: var(--naranja); color: #fff; }
.layout { display: flex; min-height: 100vh; padding-top: 26px; }

/* Barra lateral */
.sidebar { width: 248px; background: var(--side); color: #D6D8DC; position: fixed; top: 26px; bottom: 0; left: 0;
  display: flex; flex-direction: column; z-index: 40; transition: transform .2s; }
.brand { padding: 18px 20px 10px; }
.brand img { width: 100%; max-width: 180px; display: block; }
nav { flex: 1; overflow-y: auto; padding: 8px 10px; }
.nav-group { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #7D8189; padding: 14px 10px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: #C9CBD0;
  text-decoration: none; font-weight: 500; }
.nav-item:hover { background: var(--side-2); color: #fff; }
.nav-item.active { background: linear-gradient(90deg, rgba(254,92,1,.22), rgba(254,92,1,.06)); color: #fff; box-shadow: inset 3px 0 0 var(--naranja); }
.nav-item.active svg { color: var(--naranja); }
.nav-item .tag { margin-left: auto; font-size: 10px; background: var(--naranja); color: #fff; border-radius: 10px; padding: 1px 7px; }
.user { display: flex; gap: 10px; align-items: center; padding: 14px 18px; border-top: 1px solid #2A2C31; }
.user strong { display: block; color: #fff; font-size: 13px; }
.user span { font-size: 12px; color: #8C9098; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--naranja); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }

.main { flex: 1; margin-left: 248px; min-width: 0; }
.topbar { position: sticky; top: 26px; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 12px 24px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.crumb { font-weight: 700; font-size: 17px; white-space: nowrap; }
.search { margin-left: auto; display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; padding: 7px 12px; width: min(380px, 40vw); color: var(--muted); }
.search input { border: 0; outline: 0; background: transparent; color: var(--text); width: 100%; font: inherit; }
.icon-btn { position: relative; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px;
  width: 38px; height: 38px; display: grid; place-items: center; }
.icon-btn .dot { position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--naranja); }
.menu-btn { display: none; }
main#view { padding: 22px 24px 40px; }

/* Piezas comunes */
.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.cols-2 { grid-template-columns: 1.4fr 1fr; }
.cols-2e { grid-template-columns: 1fr 1fr; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.card h3 { margin: 0 0 14px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.card h3 .sub { margin-left: auto; font-weight: 500; font-size: 12px; color: var(--muted); }
.kpi { display: flex; flex-direction: column; gap: 6px; }
.kpi .lbl { color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
.kpi .val { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.kpi .delta { font-size: 12px; color: var(--ok); font-weight: 600; }
.kpi .delta.down { color: var(--bad); }
.kpi .ico { width: 32px; height: 32px; border-radius: 9px; background: var(--naranja-suave); color: var(--naranja); display: grid; place-items: center; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
.page-head p { margin: 4px 0 0; color: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--card); color: var(--text);
  padding: 8px 14px; border-radius: 9px; font-weight: 600; font-size: 13px; text-decoration: none; }
.btn:hover { border-color: var(--acero-osc); }
.btn.primary { background: var(--naranja); border-color: var(--naranja); color: #fff; }
.btn.primary:hover { background: var(--naranja-2); }
.btn.sm { padding: 5px 10px; font-size: 12px; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600;
  padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.click { cursor: pointer; }
tr.click:hover td { background: color-mix(in srgb, var(--naranja) 5%, transparent); }
.table-wrap { overflow-x: auto; margin: 0 -18px -18px; }
.table-wrap table { min-width: 640px; }
.table-wrap th:first-child, .table-wrap td:first-child { padding-left: 18px; }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.info { background: var(--info-bg); color: var(--info); }
.pill.neutral { background: color-mix(in srgb, var(--muted) 14%, transparent); color: var(--muted); }
.pill.brand { background: var(--naranja-suave); color: var(--naranja); }

.bar { height: 8px; border-radius: 6px; background: color-mix(in srgb, var(--muted) 16%, transparent); overflow: hidden; min-width: 80px; }
.bar > span { display: block; height: 100%; background: var(--naranja); border-radius: 6px; }
.bar.ok > span { background: var(--ok); }
.progress { display: flex; align-items: center; gap: 8px; }
.progress b { font-size: 12px; width: 36px; text-align: right; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tab { padding: 9px 14px; border: 0; background: none; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.active { color: var(--text); border-bottom-color: var(--naranja); }

.list { display: flex; flex-direction: column; }
.list-item { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: 0; }
.list-item .li-ico { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.list-item .li-main { flex: 1; min-width: 0; }
.list-item .li-main strong { display: block; font-size: 13.5px; }
.list-item .li-main span { color: var(--muted); font-size: 12.5px; }
.li-ico.bad { background: var(--bad-bg); color: var(--bad); }
.li-ico.warn { background: var(--warn-bg); color: var(--warn); }
.li-ico.info { background: var(--info-bg); color: var(--info); }
.li-ico.ok { background: var(--ok-bg); color: var(--ok); }

/* Gráfico de barras simple */
.chart { display: flex; align-items: flex-end; gap: 10px; height: 180px; padding-top: 10px; }
.chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.chart .stack { width: 100%; max-width: 38px; display: flex; flex-direction: column-reverse; border-radius: 6px 6px 0 0; overflow: hidden; }
.chart .stack span { display: block; }
.chart .col small { color: var(--muted); font-size: 11px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* Mapa */
.map-layout { display: grid; grid-template-columns: 1fr 320px; gap: 16px; height: calc(100vh - 26px - 63px - 22px - 40px - 70px); min-height: 520px; }
#map, .mini-map { width: 100%; height: 100%; border-radius: var(--radius); border: 1px solid var(--line); z-index: 1; }
.map-side { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
.veh { display: flex; gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--card); }
.veh:hover { border-color: var(--naranja); }
.veh .plate { font-weight: 700; font-family: ui-monospace, Consolas, monospace; }
.veh-marker { background: var(--naranja); color: #fff; border: 2px solid #fff; border-radius: 8px; padding: 2px 6px; font-weight: 700;
  font-size: 11px; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.35); font-family: ui-monospace, Consolas, monospace; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 20px; padding: 5px 11px; font-size: 12px; font-weight: 600; }
.chip.active { background: var(--negro); color: #fff; border-color: var(--negro); }
.leaflet-popup-content { font-family: Inter, system-ui, sans-serif; font-size: 13px; }
.leaflet-popup-content strong { font-size: 14px; }

/* Kanban */
.kanban { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.kcol { background: color-mix(in srgb, var(--muted) 8%, transparent); border-radius: var(--radius); padding: 10px; min-height: 300px; }
.kcol h4 { margin: 4px 4px 10px; font-size: 13px; display: flex; justify-content: space-between; }
.kcard { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px; margin-bottom: 8px; box-shadow: var(--shadow); }
.kcard strong { display: block; font-size: 13px; margin-bottom: 4px; }
.kcard .row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 12px; }

/* Etapas de producción */
.steps { display: flex; gap: 4px; }
.steps span { flex: 1; height: 6px; border-radius: 4px; background: color-mix(in srgb, var(--muted) 18%, transparent); min-width: 18px; }
.steps span.on { background: var(--naranja); }

/* Equipos (arriendo) */
.equip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.equip { display: flex; flex-direction: column; gap: 8px; }
.equip .eimg { height: 110px; border-radius: 9px; background: linear-gradient(135deg, #26272B, #3B3D42); display: grid; place-items: center; color: var(--naranja); }
.equip .eimg svg { width: 44px; height: 44px; stroke-width: 1.5; }
.equip .erow { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; }

/* Modal e informe */
.modal { position: fixed; inset: 0; background: rgba(10,10,12,.55); z-index: 100; display: grid; place-items: center; padding: 20px; }
.modal[hidden] { display: none; }
.modal-card { background: var(--card); border-radius: 14px; width: min(860px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.modal-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); z-index: 2; }
.modal-head h2 { margin: 0; font-size: 17px; }
.modal-head .actions { margin-left: auto; }
.modal-body { padding: 20px; }

.report { color: #1C1D21; background: #fff; padding: 22px; border-radius: 10px; }
#print-area .report { padding: 0; }
.report-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; border-bottom: 3px solid var(--naranja); padding-bottom: 14px; }
.report-head img { height: 64px; }
.report-head .rh-right { text-align: right; font-size: 12px; color: #555; }
.report-head .rh-right strong { display: block; font-size: 16px; color: #111; }
.report h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--naranja); margin: 18px 0 8px; }
.report .kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 18px; font-size: 13px; }
.report .kv span { display: block; font-size: 11px; color: #777; }
.report .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; font-size: 13px; }
.report .checks div { display: flex; justify-content: space-between; border-bottom: 1px dashed #ddd; padding: 5px 0; }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.photo { aspect-ratio: 4/3; border-radius: 8px; background: linear-gradient(160deg, #D9DCE1, #AEB3BA); position: relative; overflow: hidden; display: grid; place-items: center; color: #fff; }
.photo svg { width: 34px; height: 34px; opacity: .85; }
.photo small { position: absolute; left: 6px; bottom: 6px; right: 6px; font-size: 10px; background: rgba(0,0,0,.55); padding: 3px 6px; border-radius: 4px; color: #fff; }
.report .mini-map { height: 180px; }
.sign { display: flex; gap: 30px; margin-top: 18px; }
.sign div { flex: 1; border-top: 1px solid #999; padding-top: 6px; font-size: 12px; color: #555; text-align: center; }
.sign .firma { font-family: "Segoe Script", "Brush Script MT", cursive; font-size: 22px; color: #223; border: 0; padding: 0; height: 34px; }

/* Vista celular */
.phone-wrap { display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap; }
.phone { width: 360px; height: 720px; border-radius: 42px; background: #0B0B0C; padding: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.3); flex: none; }
.phone-screen { width: 100%; height: 100%; border-radius: 32px; background: #F4F5F7; overflow: hidden; display: flex; flex-direction: column; color: #1C1D21; }
.ph-top { background: var(--negro); color: #fff; padding: 16px 16px 14px; }
.ph-top .ph-row { display: flex; justify-content: space-between; align-items: center; }
.ph-top img { height: 30px; }
.ph-top h3 { margin: 12px 0 2px; font-size: 17px; }
.ph-top p { margin: 0; font-size: 12px; color: #B9BCC2; }
.ph-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.ph-card { background: #fff; border-radius: 14px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.ph-card h5 { margin: 0 0 8px; font-size: 13px; }
.ph-check { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid #EEE; font-size: 13px; }
.ph-check:last-child { border-bottom: 0; }
.seg { display: flex; gap: 4px; }
.seg button { border: 1px solid #DDD; background: #fff; border-radius: 8px; padding: 4px 8px; font-size: 11px; font-weight: 600; color: #333; }
.seg button.on-ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.seg button.on-bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.ph-photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ph-photos .photo { border-radius: 8px; }
.ph-add { aspect-ratio: 4/3; border: 2px dashed #CCC; border-radius: 8px; display: grid; place-items: center; color: #999; background: #fff; }
.ph-gps { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ok); font-weight: 600; }
.ph-btn { margin: 0 12px 14px; background: var(--naranja); color: #fff; border: 0; border-radius: 12px; padding: 14px; font-weight: 700; font-size: 15px; }
.phone-notes { flex: 1; min-width: 260px; max-width: 460px; }
.phone-notes li { margin-bottom: 10px; line-height: 1.5; }

.empty-note { padding: 14px; border-radius: 10px; background: var(--naranja-suave); color: var(--text); font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.empty-note svg { color: var(--naranja); margin-top: 1px; }

/* Adaptación a pantallas chicas */
@media (max-width: 1100px) {
  .cols-2, .cols-2e { grid-template-columns: 1fr; }
  .map-layout { grid-template-columns: 1fr; height: auto; }
  #map { height: 460px; }
}
@media (max-width: 860px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.4); }
  .main { margin-left: 0; }
  .menu-btn { display: grid; }
  .search { display: none; }
  .topbar { padding: 10px 16px; }
  main#view { padding: 16px 16px 32px; }
  .report .kv { grid-template-columns: 1fr 1fr; }
  .phone { transform: scale(.92); transform-origin: top left; }
  .demo-banner { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; }
  .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi .val { font-size: 21px; }
  .card { padding: 14px; }
  .table-wrap { margin: 0 -14px -14px; }
}

/* Impresión: solo el informe */

/* Modo captura */
body.captura .demo-banner { display: none; }
body.captura .layout { padding-top: 0; }
body.captura .sidebar { top: 0; }
body.captura .topbar { top: 0; }

/* Cotizador */
.cot-linea { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.cot-linea svg { width: 15px; height: 15px; color: var(--naranja); }
tr.sel td { background: color-mix(in srgb, var(--naranja) 9%, transparent); }
tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--naranja); }
.seg-warn { color: var(--warn); font-weight: 600; } .seg-ok { color: var(--ok); font-weight: 600; } .seg-bad { color: var(--bad); font-weight: 600; }
.seg-brand { color: var(--naranja); font-weight: 600; } .seg-muted { color: var(--muted); }
.cot-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.cot-main { display: flex; flex-direction: column; gap: 16px; }
.cot-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.cot-head h2 { margin: 4px 0 2px; font-size: 19px; text-wrap: balance; }
.cot-tags { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.cot-asist { border: 1px dashed color-mix(in srgb, var(--naranja) 55%, var(--line)); background: color-mix(in srgb, var(--naranja) 4%, var(--card)); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.cot-asist h4, .cot-toolbar h4, .cot-resumen h4 { margin: 0; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
.cot-asist h4 svg { color: var(--naranja); }
.cot-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px 12px; }
.cot-fields label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); font-weight: 600; min-width: 0; }
.cot-fields .f-wide { grid-column: span 2; }
.cot-fields .f-full { grid-column: 1 / -1; }
.cot-fields input, .cot-fields select, .cot-fields textarea, .cot-in { font: inherit; font-size: 13.5px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; min-width: 0; width: 100%; }
.cot-fields textarea { resize: vertical; line-height: 1.45; }
.cot-fields input:focus, .cot-fields select:focus, .cot-fields textarea:focus, .cot-in:focus { outline: 2px solid color-mix(in srgb, var(--naranja) 60%, transparent); outline-offset: 0; border-color: var(--naranja); }
.f-check { flex-direction: row !important; align-items: center; gap: 8px !important; font-size: 13px !important; color: var(--text) !important; font-weight: 500 !important; cursor: pointer; }
.f-check input { width: 16px; height: 16px; accent-color: var(--naranja); }
.cot-calc { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; line-height: 1.5; color: var(--text); }
.cot-calc > div { flex: 1 1 300px; min-width: 0; }
.cot-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.cot-tabla { margin: 0 -18px; }
.cot-tabla table { min-width: 860px; }
.cot-tabla td:first-child { min-width: 240px; }
.cot-in { width: 100px; text-align: right; padding: 5px 7px; font-variant-numeric: tabular-nums; }
.cot-desc { width: 64px; display: inline-block; margin: 0 2px; }
tr.cot-cargo td { background: color-mix(in srgb, var(--info) 5%, transparent); }
.cot-del { width: 32px; height: 32px; display: grid; place-items: center; padding: 0; }
.cot-del svg { width: 15px; height: 15px; }
.cot-cond { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 18px; font-size: 13px; border-top: 1px solid var(--line); padding-top: 14px; }
.cot-cond span { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
.cot-resumen { position: sticky; top: 90px; display: flex; flex-direction: column; gap: 12px; }
.cot-resumen h3 { margin-bottom: 0; }
.cs-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13.5px; padding: 6px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.cs-row span { color: var(--muted); }
.cs-total { border-bottom: 0; padding-top: 10px; font-size: 18px; }
.cs-total span { color: var(--text); font-weight: 700; }
.cs-interno { margin-top: 10px; padding: 12px; border-radius: 10px; background: color-mix(in srgb, var(--muted) 9%, transparent); }
.cs-interno .cs-row { border-bottom-color: color-mix(in srgb, var(--muted) 18%, transparent); }
.cs-lbl { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.cs-lbl svg { width: 14px; height: 14px; }
.bar.warn > span { background: var(--warn); } .bar.bad > span { background: var(--bad); }
.cs-aviso { margin-top: 10px; display: flex; gap: 8px; font-size: 12.5px; color: var(--warn); font-weight: 600; line-height: 1.4; }
.cs-resp { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--naranja-suave); line-height: 1.45; }
.cs-ok { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--ok-bg); color: var(--ok); }
.cot-acc { display: flex; flex-direction: column; gap: 8px; }
.cot-acc .btn { justify-content: center; }

.cot-hist li { position: relative; }

.cot-hist span { display: block; font-size: 11.5px; color: var(--muted); }
.cot-nueva { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.cot-nueva button { text-align: left; display: flex; flex-direction: column; gap: 6px; cursor: pointer; font: inherit; color: var(--text); }
.cot-nueva button:hover { border-color: var(--naranja); }
.cot-nueva svg { color: var(--naranja); width: 24px; height: 24px; }
.cot-envio { display: flex; flex-direction: column; gap: 14px; }
.cot-enlace { display: flex; gap: 10px; padding: 12px; border-radius: 10px; background: var(--info-bg); font-size: 13px; }

.report .rep-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.report .rep-table th { text-align: left; font-size: 11px; color: #777; border-bottom: 2px solid #222; padding: 6px; }
.report .rep-table td { border-bottom: 1px solid #e5e5e5; padding: 6px; color: #1C1D21; background: #fff; }
.report .rep-tot { margin: 10px 0 0 auto; width: min(300px, 100%); font-size: 13px; }
.report .rep-tot div { display: flex; justify-content: space-between; padding: 4px 0; font-variant-numeric: tabular-nums; }
.report .rep-tot span { color: #666; }
.report .rep-tot .t { border-top: 2px solid var(--naranja); margin-top: 4px; padding-top: 8px; font-size: 16px; font-weight: 700; }
@media (max-width: 1100px) {
  .cot-layout { grid-template-columns: minmax(0, 1fr); }
  .cot-resumen { position: static; }
}
@media (max-width: 560px) { .cot-fields .f-wide { grid-column: 1 / -1; } }

/* ---- Demo en línea: mapa vectorial, recorrido guiado y avisos ---- */
:root { --map-bg: #E9ECEF; --map-land: #F7F8FA; --map-line: #C3C8CF; --map-road: #FFFFFF; --map-road-edge: #D3D7DD; --map-label: #7A7F87; --tour-bg: #17181B; --tour-text: #F1F2F4; --tour-muted: #A7ABB2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --map-bg: #0B0C0E; --map-land: #15171A; --map-line: #2E3137; --map-road: #2A2D33; --map-road-edge: #2A2D33; --map-label: #80858D; } }
:root[data-theme="dark"] { --map-bg: #0B0C0E; --map-land: #15171A; --map-line: #2E3137; --map-road: #2A2D33; --map-road-edge: #2A2D33; --map-label: #80858D; }

.leaflet-container { background: var(--map-bg); font-family: Inter, system-ui, sans-serif; }
.leaflet-interactive.comuna, path.comuna { fill: var(--map-land); fill-opacity: 1; stroke: var(--map-line); }
path.eje { stroke: var(--map-road); stroke-opacity: 1; fill: none; stroke-linecap: round; filter: drop-shadow(0 0 1px var(--map-road-edge)); }
.comuna-label { color: var(--map-label); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; transform: translate(-50%, -50%); pointer-events: none; }
.leaflet-tooltip.eje-label { background: none; border: 0; box-shadow: none; padding: 0; color: var(--map-label); font-size: 10.5px; font-weight: 600; display: none; }
.leaflet-tooltip.eje-label::before { display: none; }
.z-alto .leaflet-tooltip.eje-label { display: block; }
.pin-marker { width: 22px; height: 22px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--naranja); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.leaflet-control-attribution { font-size: 10px; }

/* Bienvenida */
.tour-welcome { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(10, 11, 13, .55); backdrop-filter: blur(3px); overflow-y: auto; }
.tw-card { width: min(560px, 100%); background: var(--tour-bg); color: var(--tour-text); border-radius: 18px; padding: 36px 36px 28px; box-shadow: 0 24px 60px rgba(0,0,0,.4);
  display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; }
.tw-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--naranja); }
.tw-card img { width: 190px; max-width: 60%; }
.tw-kicker { margin: 10px 0 0; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--naranja-2); }
.tw-card h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
.tw-sub { margin: 0; color: var(--tour-muted); font-size: 15px; line-height: 1.55; }
.tw-list { list-style: none; margin: 4px 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-size: 13.5px; }
.tw-list li { display: flex; align-items: center; gap: 8px; }
.tw-list svg { color: var(--naranja); }
.tw-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.tw-actions .btn { padding: 11px 16px; font-size: 14px; }
.tw-card .btn:not(.primary) { background: transparent; color: var(--tour-text); border-color: #3A3C42; }
.tw-note { margin: 0; font-size: 12px; color: var(--tour-muted); }

/* Panel del recorrido */
.tour-panel { position: fixed; z-index: 150; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: 370px; max-width: calc(100vw - 32px);
  background: var(--tour-bg); color: var(--tour-text); border-radius: 16px; padding: 18px 20px 16px; box-shadow: 0 18px 50px rgba(0,0,0,.35); overflow: hidden; animation: tp-in .25s ease-out; }
@keyframes tp-in { from { transform: translateY(8px); opacity: .6; } to { transform: none; opacity: 1; } }
.tp-bar { position: absolute; left: 0; right: 0; top: 0; height: 4px; background: #2C2E33; }
.tp-bar span { display: block; height: 100%; background: var(--naranja); transition: width .3s; }
.tp-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tp-kicker { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--naranja-2); }
.tp-x { background: none; border: 0; color: var(--tour-muted); padding: 4px; border-radius: 6px; display: grid; place-items: center; }
.tp-x:hover { color: #fff; background: #2C2E33; }
.tour-panel h2 { margin: 6px 0 6px; font-size: 19px; line-height: 1.25; font-weight: 700; text-wrap: balance; }
.tour-panel p { margin: 0; font-size: 13.5px; line-height: 1.55; color: #C9CCD1; }
.tp-contacto { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #222428; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.tp-contacto span { color: var(--tour-muted); user-select: all; }
.tp-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; }
.tour-panel .btn:not(.primary) { background: transparent; color: var(--tour-text); border-color: #3A3C42; }
.tour-panel .btn:disabled { opacity: .35; cursor: default; }
.tour-fab { position: fixed; z-index: 150; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 8px;
  background: var(--tour-bg); color: #fff; border: 0; border-radius: 999px; padding: 11px 18px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.tour-fab svg { color: var(--naranja); }
.tour-fab:hover { background: #24262A; }
.tour-foco { outline: 3px solid var(--naranja); outline-offset: 4px; border-radius: var(--radius); animation: foco 1.6s ease-out 2; }
@keyframes foco { 0% { outline-color: rgba(254,92,1,1); } 50% { outline-color: rgba(254,92,1,.35); } 100% { outline-color: rgba(254,92,1,1); } }
body.tour-on #view { padding-bottom: 240px; }
.modal { z-index: 120; }
:focus-visible { outline: 2px solid var(--naranja); outline-offset: 2px; }

#vsx-toast { position: fixed; z-index: 300; left: 50%; top: calc(40px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -10px); opacity: 0; pointer-events: none;
  background: var(--tour-bg); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.3); transition: .2s; max-width: calc(100vw - 32px); }
#vsx-toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 860px) {
  .tour-panel { left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: auto; max-width: none; padding: 16px 16px 14px; }
  .tour-panel h2 { font-size: 17px; }
  .tw-card { padding: 28px 22px 22px; }
  .tw-card h1 { font-size: 28px; }
  .tw-list { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .tour-panel, .tour-foco, #vsx-toast, .tp-bar span { animation: none; transition: none; } }
body:has(.modal:not([hidden])) .tour-fab { display: none; }

    root().innerHTML = `<section class="tour-panel" aria-live="polite" aria-label="Recorrido guiado">
      <div class="tp-bar"><span style="width:${(paso + 1) / PASOS.length * 100}%"></span></div>
      <div class="tp-head"><span class="tp-kicker">Recorrido guiado · ${paso + 1} de ${PASOS.length}</span>
        <button class="tp-x" id="tp-x" aria-label="Cerrar recorrido">${icono('x')}</button></div>
      <h2>${p.t}</h2>
      <p>${p.d}</p>
      ${p.fin ? `<div class="tp-contacto"><strong>InnVolt SpA</strong><span>innvolt.cl@gmail.com · +56 9 6657 5447</span></div>` : ''}
      <div class="tp-actions">
        <button class="btn" id="tp-prev" ${paso === 0 ? 'disabled' : ''}>${icono('arrow-left')}Anterior</button>
        ${ultimo ? `<button class="btn primary" id="tp-fin">Explorar por mi cuenta</button>`
          : `<button class="btn primary" id="tp-next">Siguiente${icono('arrow-right')}</button>`}
      </div></section>`;
    lucide.createIcons();
    document.getElementById('tp-x').onclick = cerrar;
    document.getElementById('tp-prev').onclick = () => ir(paso - 1);
    const n = document.getElementById('tp-next'); if (n) n.onclick = () => ir(paso + 1);
    const f = document.getElementById('tp-fin'); if (f) f.onclick = cerrar;
    quitarFoco();
    setTimeout(() => {
      if (p.informe && window.vsxInforme) window.vsxInforme();
      if (p.foco) { const el = document.querySelector(p.foco); if (el) { el.classList.add('tour-foco'); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } }
    }, 350);
  }

  // La app llama a esto después de cada cambio de vista
  window.vsxTourSync = (vista) => {
    if (!document.getElementById('tour-root')) return;
    if (paso === -1 && !activo && !root().innerHTML) { setTimeout(bienvenida, 0); return; }
    if (!activo) return;
    const p = PASOS[paso];
    if (p && (p.v === vista || (vista === 'inicio' && p.v === 'inicio'))) { setTimeout(pintar, 0); return; }
    if (!siguiendo) {
      const j = PASOS.findIndex((x) => x.v === vista);
      if (j >= 0) { paso = j; setTimeout(pintar, 0); } else quitarFoco();
    }
  };

  // Botones de ejemplo sin acción
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button.btn, .ph-btn, .seg button');
    if (!b || b.id || b.onclick || b.hasAttribute('onclick') || b.closest('#tour-root') || b.hasAttribute('data-close') || b.dataset.f !== undefined
      || Object.keys(b.dataset).length) return;
    vsxToast('Botón de ejemplo: en el sistema real, esta acción queda operativa.');
  });
  document.addEventListener('keydown', (e) => {
    if (!activo || e.target.matches('input, textarea')) return;
    if (e.key === 'ArrowRight' && paso < PASOS.length - 1) ir(paso + 1);
    if (e.key === 'ArrowLeft' && paso > 0) ir(paso - 1);
  });
})();

</script>
<script>
// Prototipo VSX Gestión: navegación por hash, una función de render por módulo.
(function () {
  const D = window.VSX;
  const $ = (sel, el = document) => el.querySelector(sel);
  const view = $('#view');
  const clp = (n) => '$' + Math.round(n).toLocaleString('es-CL');
  const mm = (n) => '$' + (n / 1_000_000).toLocaleString('es-CL', { maximumFractionDigits: 1 }) + ' MM';
  const pill = (txt, tipo) => `<span class="pill ${tipo}">${txt}</span>`;
  const ico = (name) => `<i data-lucide="${name}"></i>`;
  const bar = (pct, cls = '') => `<div class="progress"><div class="bar ${cls}" style="flex:1"><span style="width:${pct}%"></span></div><b>${pct}%</b></div>`;

  const ESTADO_REF = {
    'al-dia': { txt: 'Al día', tipo: 'ok', color: '#1F9D55' },
    'por-visitar': { txt: 'Visita vencida', tipo: 'warn', color: '#C27803' },
    'falla': { txt: 'Falla reportada', tipo: 'bad', color: '#D93025' },
  };
  const ESTADO_EQ = {
    'disponible': ['Disponible', 'ok'], 'arrendado': ['Arrendado', 'brand'],
    'en-obra': ['En obra propia', 'info'], 'mantencion': ['En mantención', 'warn'],
  };

  const NAV = [
    ['General', [['inicio', 'Inicio', 'layout-dashboard'], ['mapa', 'Mapa GPS', 'map-pinned', 'En vivo']]],
    ['Operación', [['obras', 'Obras', 'hard-hat'], ['refugios', 'Mantención refugios', 'bus-front'], ['movil', 'App de terreno', 'smartphone']]],
    ['Maquinaria', [['arriendos', 'Arriendo de equipos', 'construction'], ['flota', 'Flota y mantenciones', 'truck']]],
    ['Logística', [['compras', 'Compras y bodega', 'package-search'], ['embalaje', 'Embalaje industrial', 'package']]],
    ['Gestión', [['comercial', 'Comercial', 'briefcase'], ['cotizador', 'Cotizador', 'calculator', 'Nuevo'], ['personal', 'Personal', 'users'], ['finanzas', 'Finanzas', 'chart-column'], ['tienda', 'Tienda', 'store']]],
  ];
  const TITULOS = Object.fromEntries(NAV.flatMap(([, items]) => items.map(([k, t]) => [k, t])));

  $('#nav').innerHTML = NAV.map(([g, items]) => `<div class="nav-group">${g}</div>` +
    items.map(([k, t, i, tag]) => `<a class="nav-item" href="#${k}" data-k="${k}">${ico(i)}<span>${t}</span>${tag ? `<span class="tag">${tag}</span>` : ''}</a>`).join('')).join('');
  $('#menuBtn').onclick = () => $('#sidebar').classList.toggle('open');

  let limpiar = [];
  function render() {
    limpiar.forEach((f) => f()); limpiar = [];
    const h = location.hash.slice(1) || 'inicio'; const k = h.startsWith('obra-') ? 'obras' : h;
    const fn = VISTAS[k] || VISTAS.inicio;
    document.querySelectorAll('.nav-item').forEach((a) => a.classList.toggle('active', a.dataset.k === k));
    $('#crumb').textContent = TITULOS[k] || 'Inicio';
    $('#sidebar').classList.remove('open');
    view.innerHTML = '';
    fn();
    lucide.createIcons();
    window.scrollTo(0, 0);
    if (window.vsxTourSync) window.vsxTourSync(h);
  }
  window.addEventListener('hashchange', render);

  // ---------- Modal ----------
  function abrirModal(titulo, cuerpo, acciones = '') {
    $('#modalCard').innerHTML = `<div class="modal-head"><h2>${titulo}</h2><div class="actions">${acciones}<button class="btn sm" data-close>${ico('x')}Cerrar</button></div></div><div class="modal-body">${cuerpo}</div>`;
    $('#modal').hidden = false;
    lucide.createIcons();
  }
  function cerrarModal() { $('#modal').hidden = true; $('#modalCard').innerHTML = ''; }
  $('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) cerrarModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cerrarModal(); });

  // ---------- Mapa base ----------
  function mapa(el, centro = [-33.465, -70.655], zoom = 12) {
    const m = L.map(el, { zoomControl: true, attributionControl: true }).setView(centro, zoom);
    m.attributionControl.setPrefix(false).addAttribution('Límites comunales: BCN · mapa simplificado para la demo');
    L.geoJSON(window.VSX_COMUNAS, { style: () => ({ className: 'comuna', weight: 1 }), interactive: false }).addTo(m);
    D.ejes.forEach((e) => L.polyline([e.a, e.b], { className: 'eje', weight: 6, interactive: false }).addTo(m)
      .bindTooltip(e.nombre, { permanent: true, direction: 'center', className: 'eje-label', opacity: 1 }));
    const etiquetas = L.layerGroup(window.VSX_COMUNAS.features.map((f) => L.marker(f.properties.c, { interactive: false,
      icon: L.divIcon({ className: 'comuna-label', html: f.properties.n, iconSize: null }) })));
    const zoomEtiquetas = () => { const z = m.getZoom(); m.getContainer().classList.toggle('z-alto', z >= 14); if (z >= 12) etiquetas.addTo(m); else etiquetas.remove(); };
    m.on('zoomend', zoomEtiquetas); zoomEtiquetas();
    return m;
  }
  const puntoRefugio = (r) => L.circleMarker([r.lat, r.lng], {
    radius: r.estado === 'al-dia' ? 5 : 7, color: '#fff', weight: 1.5, fillColor: ESTADO_REF[r.estado].color, fillOpacity: 1,
  });
  const posVehiculo = (v) => {
    const e = v.ejeData;
    return [e.a[0] + (e.b[0] - e.a[0]) * v.t, e.a[1] + (e.b[1] - e.a[1]) * v.t];
  };

  // =====================================================================
  const VISTAS = {};

  VISTAS.inicio = () => {
    const fallas = D.refugios.filter((r) => r.estado === 'falla').length;
    const vencidas = D.refugios.filter((r) => r.estado === 'por-visitar').length;
    const arrendados = D.equipos.filter((e) => e.estado === 'arrendado').length;
    const porCobrar = D.estadosPago.filter((e) => !e.estado.startsWith('Pagado')).reduce((a, e) => a + e.monto, 0) + 182_400_000;
    const tot = D.meses.map((_, i) => D.ingresos.obras[i] + D.ingresos.arriendo[i] + D.ingresos.embalaje[i]);
    const max = Math.max(...tot);
    view.innerHTML = `
      <div class="page-head"><div><h1>Buenos días, equipo VSX</h1><p>Lunes 2 de noviembre de 2026 · resumen de todas las líneas de negocio</p></div>
        <div class="actions"><a class="btn" href="#mapa">${ico('map-pinned')}Ver mapa</a><a class="btn primary" href="#obras">${ico('plus')}Nueva obra</a></div></div>
      <div class="grid kpis">
        ${kpi('hard-hat', 'Obras activas', D.obras.length, '1 atrasada', true)}
        ${kpi('wallet', 'Facturado octubre', '$335 MM', '+11 % vs. septiembre')}
        ${kpi('receipt', 'Por cobrar', mm(porCobrar), '3 estados de pago abiertos', null)}
        ${kpi('bus-front', 'Refugios mantenidos', D.refugios.length, `${fallas} con falla · ${vencidas} con visita vencida`, true)}
        ${kpi('construction', 'Equipos arrendados', `${arrendados} / ${D.equipos.length}`, 'Ocupación 42 %')}
        ${kpi('package', 'Pedidos de embalaje', D.embalajes.filter((e) => e.etapa < 5).length, '2 se entregan esta semana', null)}
      </div>
      <div class="grid cols-2" style="margin-top:16px">
        <div class="card"><h3>${ico('chart-column')}Ingresos por línea de negocio<span class="sub">millones de pesos · *mes en curso</span></h3>
          <div class="chart">${D.meses.map((m, i) => `<div class="col"><small>${tot[i]}</small><div class="stack" style="height:${tot[i] / max * 140}px">
            <span style="height:${D.ingresos.obras[i] / tot[i] * 100}%;background:var(--naranja)"></span>
            <span style="height:${D.ingresos.arriendo[i] / tot[i] * 100}%;background:#5B5E66"></span>
            <span style="height:${D.ingresos.embalaje[i] / tot[i] * 100}%;background:var(--acero)"></span></div><small>${m}</small></div>`).join('')}</div>
          <div class="legend"><span><i style="background:var(--naranja)"></i>Obras civiles</span><span><i style="background:#5B5E66"></i>Arriendo de maquinaria</span><span><i style="background:var(--acero)"></i>Embalaje industrial</span></div>
        </div>
        <div class="card"><h3>${ico('bell-ring')}Requiere atención<span class="sub">hoy</span></h3><div class="list">
          ${D.vencimientos.map((v) => `<div class="list-item"><div class="li-ico ${v.tipo}">${ico(v.tipo === 'bad' ? 'triangle-alert' : 'calendar-clock')}</div>
            <div class="li-main"><strong>${v.que}</strong><span>${v.de}</span></div>${pill(v.dias < 0 ? `Vencida hace ${-v.dias} d` : `En ${v.dias} días`, v.tipo)}</div>`).join('')}
          <div class="list-item"><div class="li-ico bad">${ico('bus-front')}</div><div class="li-main"><strong>${fallas} refugios con falla reportada</strong><span>Vidrios, luminarias y grafitis pendientes</span></div><a class="btn sm" href="#refugios">Ver</a></div>
          <div class="list-item"><div class="li-ico warn">${ico('file-check')}</div><div class="li-main"><strong>OC-1842 espera aprobación</strong><span>Hormigón HF-5 · ${clp(6_528_000)}</span></div><a class="btn sm" href="#compras">Revisar</a></div>
        </div></div>
      </div>
      <div class="grid cols-2" style="margin-top:16px">
        <div class="card"><h3>${ico('hard-hat')}Avance de obras<span class="sub">físico vs. financiero</span></h3><div class="table-wrap"><table>
          <thead><tr><th>Obra</th><th>Avance físico</th><th>Estado</th></tr></thead><tbody>
          ${D.obras.map((o) => `<tr class="click" onclick="location.hash='#obra-${o.id}'"><td><strong>${o.nombre}</strong><div class="muted small">${o.id} · ${o.mandante}</div></td><td style="width:200px">${bar(o.avance)}</td><td>${pill(o.estado, o.estado === 'Atrasada' ? 'bad' : o.estado === 'Inicio' ? 'info' : 'ok')}</td></tr>`).join('')}
          </tbody></table></div></div>
        <div class="card" style="padding:0;overflow:hidden;min-height:340px;display:flex;flex-direction:column">
          <div style="padding:18px 18px 0"><h3>${ico('map-pinned')}Cuadrillas en terreno<span class="sub"><a href="#mapa" style="color:var(--naranja)">Abrir mapa</a></span></h3></div>
          <div id="miniMapa" style="flex:1;min-height:280px"></div></div>
      </div>`;
    const m = mapa($('#miniMapa'), [-33.465, -70.655], 11);
    $('#miniMapa').style.borderRadius = '0';
    D.refugios.forEach((r) => puntoRefugio(r).addTo(m));
    D.vehiculos.forEach((v) => L.marker(posVehiculo(v), { icon: L.divIcon({ className: '', html: `<div class="veh-marker">${v.patente}</div>`, iconSize: null }) }).addTo(m));
    limpiar.push(() => m.remove());
  };

  function kpi(icono, lbl, val, delta, alerta) {
    return `<div class="card kpi"><div class="lbl"><span class="ico">${ico(icono)}</span>${lbl}</div><div class="val">${val}</div>
      <div class="delta ${alerta ? 'down' : ''}" style="${alerta === null ? 'color:var(--muted)' : ''}">${delta}</div></div>`;
  }

  // ---------- Mapa GPS ----------
  VISTAS.mapa = () => {
    let filtro = 'todos';
    view.innerHTML = `
      <div class="page-head"><div><h1>Mapa GPS</h1><p>Plataforma GPS propia · vehículos de mantención en vivo y los ${D.refugios.length} refugios peatonales a cargo</p></div>
        <div class="filters" id="filtros">
          ${[['todos', 'Todos'], ['falla', 'Con falla'], ['por-visitar', 'Visita vencida'], ['al-dia', 'Al día']].map(([k, t]) => `<button class="chip ${k === 'todos' ? 'active' : ''}" data-f="${k}">${t}</button>`).join('')}
        </div></div>
      <div class="map-layout"><div id="map"></div>
        <div class="map-side">
          <div class="card" style="padding:14px"><h3 style="margin-bottom:10px">${ico('truck')}Vehículos<span class="sub">actualiza cada 2 s</span></h3>
            <div id="vehLista" style="display:flex;flex-direction:column;gap:8px"></div></div>
          <div class="card" style="padding:14px"><h3 style="margin-bottom:8px">${ico('file-text')}Informes por ubicación</h3>
            <div class="list">
              <div class="list-item"><div class="li-ico info">${ico('map-pin')}</div><div class="li-main"><strong>Visita a un punto</strong><span>Clic en un refugio → último informe</span></div></div>
              <div class="list-item"><div class="li-ico info">${ico('route')}</div><div class="li-main"><strong>Recorrido del día</strong><span>Clic en un vehículo → ruta, detenciones y km</span></div></div>
              <div class="list-item"><div class="li-ico info">${ico('map')}</div><div class="li-main"><strong>Resumen por comuna</strong><span><a href="#refugios" style="color:var(--naranja)">Ver en Mantención refugios</a></span></div></div>
            </div></div>
        </div></div>`;
    const m = mapa($('#map'));
    const capa = L.layerGroup().addTo(m);
    const pintar = () => {
      capa.clearLayers();
      D.refugios.filter((r) => filtro === 'todos' || r.estado === filtro).forEach((r) => {
        const e = ESTADO_REF[r.estado];
        puntoRefugio(r).bindPopup(`<strong>${r.id} · ${r.codigo}</strong><br>${r.direccion}, ${r.comuna}<br>
          <span style="color:${e.color};font-weight:600">${e.txt}</span>${r.falla ? ' — ' + r.falla : ''}<br>Última visita: ${r.ultimaVisita}<br>
          <button class="btn sm primary" style="margin-top:8px" data-informe="${r.id}">Ver informe</button>`).addTo(capa);
      });
    };
    pintar();
    $('#filtros').onclick = (e) => {
      const b = e.target.closest('[data-f]'); if (!b) return;
      filtro = b.dataset.f;
      document.querySelectorAll('#filtros .chip').forEach((c) => c.classList.toggle('active', c === b));
      pintar();
    };
    m.on('popupopen', (ev) => {
      const b = ev.popup.getElement().querySelector('[data-informe]');
      if (b) b.onclick = () => informeVisita(D.refugios.find((r) => r.id === b.dataset.informe));
    });

    const marcadores = D.vehiculos.map((v) => L.marker(posVehiculo(v), {
      icon: L.divIcon({ className: '', html: `<div class="veh-marker">${v.patente}</div>`, iconSize: null }), zIndexOffset: 1000,
    }).addTo(m).on('click', () => recorrido(v)));
    const lista = () => {
      $('#vehLista').innerHTML = D.vehiculos.map((v, i) => `<div class="veh" data-v="${i}"><div class="li-ico ${v.estado === 'en-ruta' ? 'ok' : 'warn'}" style="width:34px;height:34px;border-radius:9px;display:grid;place-items:center">${ico('truck')}</div>
        <div style="flex:1;min-width:0"><div class="plate">${v.patente}</div><div class="muted small">${v.chofer} · ${v.cuadrilla}</div></div>
        <div style="text-align:right">${pill(v.estado === 'en-ruta' ? 'En ruta' : 'Detenido', v.estado === 'en-ruta' ? 'ok' : 'warn')}<div class="muted small" style="margin-top:3px">${v.visitasHoy} visitas · ${v.km} km</div></div></div>`).join('');
      lucide.createIcons();
    };
    lista();
    $('#vehLista').onclick = (e) => {
      const el = e.target.closest('[data-v]'); if (!el) return;
      const v = D.vehiculos[+el.dataset.v];
      m.flyTo(posVehiculo(v), 15, { duration: .8 });
    };
    const timer = setInterval(() => {
      D.vehiculos.forEach((v, i) => {
        if (v.estado !== 'en-ruta') return;
        v.t += v.dir * v.vel * 0.5;
        if (v.t > 1 || v.t < 0) { v.dir *= -1; v.t = Math.min(1, Math.max(0, v.t)); }
        marcadores[i].setLatLng(posVehiculo(v));
      });
    }, 2000);
    limpiar.push(() => { clearInterval(timer); m.remove(); });
  };

  function recorrido(v) {
    const e = v.ejeData;
    const visitados = D.refugios.filter((r) => r.eje === e.nombre).slice(0, v.visitasHoy);
    abrirModal(`Recorrido del día · ${v.patente}`, `
      <div class="grid kpis" style="margin-bottom:16px">
        ${kpi('route', 'Kilómetros', v.km + ' km', 'Salida 07:48 desde base', null)}
        ${kpi('map-pin', 'Visitas', v.visitasHoy, `${visitados.filter((r) => r.estado === 'falla').length} con reparación`, null)}
        ${kpi('clock', 'Detenciones', int2(v), 'Tiempo detenido 2 h 10 min', null)}
        ${kpi('fuel', 'Velocidad máx.', '62 km/h', 'Sin excesos', null)}
      </div>
      <div id="mapRec" style="height:300px;border-radius:12px;border:1px solid var(--line)"></div>
      <h4 style="margin:18px 0 8px">Paradas</h4>
      <div class="table-wrap" style="margin:0"><table><thead><tr><th>Hora</th><th>Refugio</th><th>Dirección</th><th>Duración</th><th>Informe</th></tr></thead><tbody>
      ${visitados.map((r, i) => `<tr><td class="mono">${String(8 + Math.floor(i * 0.8)).padStart(2, '0')}:${String((i * 37) % 60).padStart(2, '0')}</td><td>${r.id}</td><td>${r.direccion}</td><td>${12 + (i * 7) % 25} min</td><td><button class="btn sm" data-inf="${r.id}">${ico('file-text')}Ver</button></td></tr>`).join('')}
      </tbody></table></div>`, `<button class="btn sm primary" onclick="vsxToast('En el sistema, este botón descarga el informe en PDF.')">${ico('download')}Descargar PDF</button>`);
    const m = mapa($('#mapRec'), posVehiculo(v), 13);
    const ruta = [e.a, posVehiculo(v)];
    L.polyline(ruta, { color: '#FE5C01', weight: 5, opacity: .85 }).addTo(m);
    visitados.forEach((r) => puntoRefugio(r).addTo(m));
    m.fitBounds(L.latLngBounds(ruta).pad(0.3));
    $('#modalCard').onclick = (ev) => { const b = ev.target.closest('[data-inf]'); if (b) informeVisita(D.refugios.find((r) => r.id === b.dataset.inf)); };
    $('#print-area').innerHTML = '';
  }
  const int2 = (v) => 4 + (v.patente.charCodeAt(0) % 4);

  // ---------- Informe de visita a refugio ----------
  function informeVisita(r) {
    const conFalla = r.estado === 'falla';
    const checks = [['Estructura y techumbre', !conFalla || r.falla !== 'Techo con filtración'], ['Vidrios y paneles', !conFalla || r.falla !== 'Vidrio quebrado'], ['Iluminación', !conFalla || r.falla !== 'Luminaria apagada'],
      ['Banca y apoyos', !conFalla || r.falla !== 'Banca dañada'], ['Limpieza general', true], ['Grafitis / rayados', !conFalla || r.falla !== 'Grafiti'],
      ['Señalética y panel informativo', !conFalla || r.falla !== 'Panel informativo dañado'], ['Entorno y accesibilidad', true]];
    const html = `<div class="report">
      <div class="report-head"><img src="${window.VSX_LOGO}" alt="VSX"><div class="rh-right"><strong>Informe de mantención de refugio</strong>N° IM-${r.id.slice(3)}-1102 · ${r.ultimaVisita}<br>Contrato: Mantención refugios peatonales (demo)</div></div>
      <h4>Identificación</h4>
      <div class="kv"><div><span>Refugio</span>${r.id} · ${r.codigo}</div><div><span>Dirección</span>${r.direccion}</div><div><span>Comuna</span>${r.comuna}</div>
        <div><span>Tipo</span>${r.tipo}</div><div><span>Coordenadas GPS</span>${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}</div><div><span>Llegada / salida</span>09:42 – 10:05 (23 min)</div>

  // ---------- Cotizador ----------
  // Flujo inspirado en el cotizador de TecApp (ideas, no código): partidas de venta y cargos
  // operacionales, costos y márgenes solo internos, aviso «bajo el costo», envío con enlace,
  // seguimiento de lo que hizo el cliente y conversión en obra, contrato o pedido.
  const LINEAS_COT = { obras: ['Obras civiles', 'hard-hat', 'obra', 'OB-2621'], arriendo: ['Arriendo de maquinaria', 'construction', 'contrato de arriendo', 'AR-0425'], embalaje: ['Embalaje industrial', 'package', 'pedido de embalaje', 'EMB-314'] };
  const EST_COT = { borrador: ['Borrador', 'neutral'], enviada: ['Enviada', 'info'], aprobada: ['Aprobada', 'ok'], rechazada: ['Rechazada', 'bad'], anulada: ['Anulada', 'neutral'] };
  const MARGEN_MIN = 15;
  const fmtN = (n) => Number(n).toLocaleString('es-CL', { maximumFractionDigits: 2 });
  let cotSel = 'COT-1148', cotFiltro = 'todas', verCostos = true;

  function seguimientoCot(c) {
    if (c.estado === 'borrador') return ['En preparación', 'muted'];
    if (c.estado === 'anulada') return ['—', 'muted'];
    if (c.estado === 'aprobada' || c.estado === 'rechazada') return [`Decidió el ${c.decidio}${c.destino ? ' · ' + c.destino : ''}${c.motivo ? ' · ' + c.motivo : ''}`, c.estado === 'aprobada' ? 'ok' : 'bad'];
    if (c.respuesta) return [`${c.respuesta.tipo} · ${c.respuesta.dia}`, 'brand'];
    return c.aperturas ? [`Abrió el enlace${c.aperturas > 1 ? ` ${c.aperturas} veces` : ''}, sin responder`, 'warn'] : ['Sin abrir el enlace', 'warn'];
  }
  function calcCot(c) {
    let venta = 0, cargos = 0, costo = 0;
    c.lineas.forEach((l) => { const t = l.q * l.p; if (l.cargo) cargos += t; else venta += t; costo += l.q * l.c; });
    const descuento = Math.round(venta * (c.desc || 0) / 100);
    const neto = venta - descuento + cargos;
    const iva = Math.round(neto * 0.19);
    const margen = neto - costo;
    return { venta, cargos, descuento, neto, iva, total: neto + iva, costo, margen, pct: neto ? margen / neto * 100 : 0 };
  }

  VISTAS.cotizador = () => {

    const vigentes = C.filter((c) => c.estado === 'enviada' && !c.vencida);
    view.innerHTML = `
